apiVersion: flows.netobserv.io/v1alpha1
kind: FlowCapture
metadata:
  name: flowcapture-sample
spec:
  # Captures flows for 30 seconds. Copy the result from the collector pod with:
  # oc cp -n <namespace> flowcapture-sample-collector:output ./output
  type: flows
  maxTime: 30s
  maxBytes: 10000000
  sampling: 1
  excludeInterfaces:
  - lo
