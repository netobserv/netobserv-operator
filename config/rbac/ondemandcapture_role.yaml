# The standalone Go CLI creates an isolated namespace and its capture resources.
# Bind this role only to the per-capture service accounts managed by the operator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ondemandcapture-cli
rules:
- apiGroups: [""]
  resources: [namespaces, pods, services, serviceaccounts, configmaps, secrets]
  verbs: [get, list, watch, create, update, delete]
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [get, create]
- apiGroups: [""]
  resources: [pods/log, nodes, endpoints]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [daemonsets]
  verbs: [get, list, watch, create, update, delete]
- apiGroups: [apps]
  resources: [replicasets]
  verbs: [get, list, watch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [roles, rolebindings, clusterroles, clusterrolebindings]
  verbs: [get, create, update]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterroles]
  resourceNames: [cluster-monitoring-view]
  verbs: [bind]
- apiGroups: [security.openshift.io]
  resources: [securitycontextconstraints]
  verbs: [get, create, update]
- apiGroups: [security.openshift.io]
  resources: [securitycontextconstraints]
  resourceNames: [privileged]
  verbs: [use]
- apiGroups: [config.openshift.io]
  resources: [apiservers, clusterversions, networks, consoles]
  verbs: [get]
- apiGroups: [monitoring.coreos.com]
  resources: [servicemonitors]
  verbs: [get, create, update, delete]
- nonResourceURLs: [/metrics]
  verbs: [get]
