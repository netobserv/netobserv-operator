---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: flowcaptures.flows.netobserv.io
spec:
  group: flows.netobserv.io
  names:
    kind: FlowCapture
    listKind: FlowCaptureList
    plural: flowcaptures
    shortNames:
    - fcap
    singular: flowcapture
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: FlowCapture requests a short-lived capture of flows, packets,
          or metrics.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              excludeInterfaces:
                items:
                  type: string
                type: array
              features:
                description: |-
                  Features enables optional eBPF features. Values use the same vocabulary as
                  FlowCollector.spec.agent.ebpf.features.
                items:
                  enum:
                  - PacketDrop
                  - DNSTracking
                  - FlowRTT
                  - NetworkEvents
                  - PacketTranslation
                  - UDNMapping
                  - IPSec
                  - TLSTracking
                  - SecondaryNetworks
                  type: string
                type: array
              filters:
                description: Filters are applied by the eBPF agent.
                items:
                  description: FlowFilter is shared with the eBPF agent's FlowCollector
                    filter vocabulary.
                  properties:
                    action:
                      type: string
                    cidr:
                      type: string
                    destPort:
                      format: int32
                      type: integer
                    destPortRange:
                      type: string
                    destPorts:
                      type: string
                    direction:
                      type: string
                    icmpCode:
                      type: integer
                    icmpType:
                      type: integer
                    peerCIDR:
                      type: string
                    peerIP:
                      type: string
                    pktDrops:
                      type: boolean
                    port:
                      format: int32
                      type: integer
                    portRange:
                      type: string
                    ports:
                      type: string
                    protocol:
                      type: string
                    sampling:
                      format: int32
                      type: integer
                    sourcePort:
                      format: int32
                      type: integer
                    sourcePortRange:
                      type: string
                    sourcePorts:
                      type: string
                    tcpFlags:
                      type: string
                  type: object
                type: array
              interfaces:
                items:
                  type: string
                type: array
              maxBytes:
                description: MaxBytes limits flow and packet captures. It is ignored
                  for metrics and defaults to unlimited.
                format: int64
                minimum: 0
                type: integer
              maxTime:
                description: MaxTime limits the capture lifetime. The default is one
                  hour.
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                type: object
              outputType:
                description: OutputType selects the data captured by the eBPF agents.
                enum:
                - flows
                - packets
                - metrics
                type: string
              queries:
                description: |-
                  Queries are Flowlogs-Pipeline keep-entry expressions applied after enrichment.
                  They use the same syntax as the CLI --query option and are evaluated in order.
                items:
                  type: string
                type: array
              sampling:
                description: Sampling is the eBPF sampling interval. 1 captures every
                  packet. The default is 1.
                format: int32
                minimum: 1
                type: integer
              subnetLabels:
                description: SubnetLabels configures automatic subnet detection for
                  captured flows.
                properties:
                  autoDetect:
                    description: AutoDetect enables vendor-specific detection of machine,
                      pod, and service subnets.
                    type: boolean
                type: object
              tlsPlaintext:
                description: TLSPlaintext enables TLS plaintext capture for packet
                  captures.
                properties:
                  minBytes:
                    description: MinBytes drops plaintext events shorter than this
                      size. The default is 0.
                    format: int32
                    minimum: 0
                    type: integer
                  previewBytes:
                    description: |-
                      PreviewBytes limits the plaintext preview attached to exported events. 0 means unlimited.
                      The default is 256 bytes.
                    format: int32
                    minimum: 0
                    type: integer
                  processAllowlist:
                    description: |-
                      ProcessAllowlist limits uprobes to these process names. An empty list hooks eligible
                      processes on each selected node.
                    items:
                      type: string
                    type: array
                type: object
            required:
            - outputType
            type: object
          status:
            properties:
              completionTime:
                description: |-
                  CompletionTime is set when the capture is marked complete; it does not guarantee that the collector Pod has exited.
                  For managed captures, the collector Pod and its output remain available until the FlowCapture is deleted.
                  Flow captures write records to a timestamped `.json` file as a JSON array and retain the existing `.db` SQLite output. The JSON file is streamed while the capture runs and finalized when the collector closes it.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions records the lifecycle transitions of the capture in order,
                  including Starting, Running, Completed, or Failed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message contains additional human-readable status details.
                type: string
              phase:
                description: Phase is the current lifecycle phase of the capture.
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                type: string
              reason:
                description: Reason identifies the event that produced the current
                  phase.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
