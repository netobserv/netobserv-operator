# Check that the 0 container is the expected one
- op: test
  path: /spec/template/spec/containers/0/name
  value: manager

- op: add
  path: "/spec/template/metadata/annotations"
  value:
    openshift.io/required-scc: restricted-v2

- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: VENDOR
    value: OpenShift_Downstream

- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: RELATED_IMAGE_WEB_CONSOLE_PF5
    value: quay.io/netobserv/network-observability-console-plugin:v2.0.2-community-pf5

- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: RELATED_IMAGE_WEB_CONSOLE_PF4
    value: quay.io/netobserv/network-observability-console-plugin:v2.0.2-community-pf4

- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: RELATED_IMAGE_DEMO_LOKI
    value: grafana/loki:3.5.0

- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: STATIC_PLUGIN_CPU_REQUEST
    value: "10m"

- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: STATIC_PLUGIN_MEMORY_REQUEST
    value: "64Mi"

- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: STATIC_PLUGIN_CPU_LIMIT
    value: ""

- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: STATIC_PLUGIN_MEMORY_LIMIT
    value: ""
