# Check that the 0 container is the expected one
- op: test
  path: /spec/template/spec/containers/0/name
  value: manager

- op: add
  path: "/spec/template/metadata/annotations"
  value:
    openshift.io/required-scc: restricted-v2

- op: add
  path: "/spec/template/spec/volumes/-"
  value:
    name: manager-metric-tls
    secret:
      secretName: manager-metrics-tls
      defaultMode: 420

- op: add
  path: "/spec/template/spec/containers/0/volumeMounts/-"
  value:
    name: manager-metric-tls
    readOnly: true
    mountPath: /etc/tls/private

- op: add
  path: "/spec/template/spec/containers/0/args/-"
  value: '--metrics-cert-file=/etc/tls/private/tls.crt'

- op: add
  path: "/spec/template/spec/containers/0/args/-"
  value: '--metrics-cert-key-file=/etc/tls/private/tls.key'

- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: VENDOR
    value: OpenShift_Downstream

- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: RELATED_IMAGE_WEB_CONSOLE_PF5
    value: quay.io/netobserv/network-observability-console-plugin:v1.12.0-community-pf5

- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: RELATED_IMAGE_WEB_CONSOLE_PF4
    value: quay.io/netobserv/network-observability-console-plugin:v1.12.0-community-pf4
