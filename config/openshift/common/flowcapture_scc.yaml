apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: flowcapture
# FlowCapture agents use a capture-specific ServiceAccount in the namespace
# where the request was created. This SCC is therefore separate from the
# long-running FlowCollector SCC, whose subject is the privileged agent SA.
allowHostDirVolumePlugin: true
allowHostIPC: false
allowHostNetwork: true
allowHostPID: false
allowHostPorts: true
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities:
- BPF
- PERFMON
- NET_ADMIN
- SYS_ADMIN
fsGroup:
  type: RunAsAny
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
userNamespaceLevel: AllowHostLevel
volumes:
- configMap
- downwardAPI
- emptyDir
- hostPath
- projected
- secret
