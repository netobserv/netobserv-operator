kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: sriov-catalog-source-template
objects:
  - apiVersion: operators.coreos.com/v1alpha1
    kind: CatalogSource
    metadata:
      name: "${CATALOG_NAME}"
      namespace: "${NAMESPACE}"
    spec:
      displayName: SR-IOV Operator Catalog
      image: "${IMAGE}"
      sourceType: grpc
      updateStrategy:
        registryPoll:
          interval: 10m
parameters:
  - name: CATALOG_NAME
    value: sriov-konflux
  - name: IMAGE
    value: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc:ocp__5.0__ose-sriov-network-rhel9-operator
  - name: NAMESPACE
    value: openshift-marketplace
