apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: flowcollector-template
objects:
  - apiVersion: flows.netobserv.io/v1beta2
    kind: FlowCollector
    metadata:
      name: cluster
    spec:
      namespace: "${Namespace}"
      deploymentModel: "${DeploymentModel}"
      agent:
        type: eBPF
        ebpf:
          imagePullPolicy: IfNotPresent
          sampling: ${{Sampling}}
          cacheActiveTimeout: ${EBPFCacheActiveTimeout}
          cacheMaxFlows: ${{CacheMaxFlows}}
          interfaces: []
          excludeInterfaces: ["lo"]
          features: "${{EBPFeatures}}"
          logLevel: info
          privileged: "${{EBPFPrivileged}}"
          flowFilter:
            enable: "${{EBPFFilterEnable}}"
            rules: "${{EBPFFilterRules}}"
          metrics:
            enable: "${{EBPFMetrics}}"
            server:
              port: 9400
              tls:
                type: "${EBPFMetricServerTLSType}"
      processor:
        informerCacheProxy:
          enabled: true
        multiClusterDeployment: "${{MultiClusterDeployment}}"
        addZone: "${{AddZone}}"
        bgpEnrichment: "${{BgpEnrichment}}"
        service:
          providedCertificates:
            caFile:
              file: ca.crt
              name: "${ServiceCASecretName}"
              namespace: "${Namespace}"
              type: secret
            serverCert:
              certFile: tls.crt
              certKey: tls.key
              name: "${ServiceServerCertSecretName}"
              namespace: "${Namespace}"
              type: secret
            clientCert:
              certFile: tls.crt
              certKey: tls.key
              name: "${ServiceClientCertSecretName}"
              namespace: "${Namespace}"
              type: secret
          tlsType: "${ServiceTLSType}"
        metrics:
          server:
            tls:
              type: "${FLPMetricServerTLSType}"
          disableAlerts: []
        logTypes: "${LogType}"
        filters: "${{FLPFilters}}"
        slicesConfig:
          collectionMode: "${CollectionMode}"
          enable: "${{SlicesEnable}}"
          namespacesAllowList: "${{NamespacesAllow}}"
        advanced:
          dropUnusedFields: true
          conversationTerminatingTimeout: 5s
          conversationHeartbeatInterval: 5s
          conversationEndTimeout: 20s
          secondaryNetworks: "${{SecondaryNetworks}}"
      kafka:
        address: "${KafkaAddress}"
        topic: "${KafkaTopic}"
        compression: "${KafkaCompression}"
        tls:
          enable: "${{KafkaTLSEnable}}"
          caCert:
            type: secret
            name: "${KafkaClusterName}-cluster-ca-cert"
            certFile: ca.crt
            namespace: "${KafkaNamespace}"
          userCert:
            type: secret
            name: "${KafkaUser}"
            certFile: user.crt
            certKey: user.key
            namespace: "${KafkaNamespace}"
      loki:
        mode: "${LokiMode}"
        enable: "${{LokiEnable}}"
        lokiStack:
          name: "${LokistackName}"
          namespace: "${LokiNamespace}"
        monolithic:
          url: ${MonolithicLokiURL}
          installDemoLoki: "${{InstallDemoLoki}}"
      networkPolicy:
        additionalNamespaces: "${{NetworkPolicyAdditionalNamespaces}}"
        enable: "${{NetworkPolicyEnable}}"
      consolePlugin:
        enable: "${{PluginEnable}}"
        portNaming:
          enable: true
          portNames:
            "3100": loki
      exporters: "${{Exporters}}"
parameters:
  - name: Namespace
    description: "namespace where you want flowlogsPipeline and consoleplugin pods to be deployed"
    value: "netobserv"
  - name: DeploymentModel
    value: "Service"
  - name: EBPFCacheActiveTimeout
    value: 15s
  - name: Sampling
    value: "1"
  - name: EBPFPrivileged
    value: "false"
  - name: EBPFMetrics
    value: "true"
  - name: FLPMetricServerTLSType
    value: "Auto"
  - name: EBPFMetricServerTLSType
    value: "Disabled"
  - name: EBPFeatures
    value: '[]'
  - name: EBPFFilterEnable
    value: "true"
  - name: EBPFFilterRules
    value: '[{"action": "Accept","cidr": "0.0.0.0/0"}]'
  - name: CacheMaxFlows
    value: "120000"
  - name: MultiClusterDeployment
    value: "false"
  - name: AddZone
    value: "false"
  - name: BgpEnrichment
    description: "Enable BGP ASN enrichment from FRRConfiguration CRDs"
    value: "false"
  - name: LogType
    value: "Flows"
  - name: FLPFilters
    value: '[]'
  - name: CollectionMode
    value: "AlwaysCollect"
  - name: SlicesEnable
    value: "false"
  - name: NamespacesAllow
    value: '["`/netobserv.*/`"]'
  - name: LokiMode
    value: "Monolithic"
  - name: LokiEnable
    value: "true"
  - name: LokistackName
    value: "lokistack"
  - name: MonolithicLokiURL
    value: "http://loki.netobserv.svc:3100/"
  - name: InstallDemoLoki
    value: "true"
  - name: LokiNamespace
    value: "netobserv"
  - name: KafkaAddress
    value: "kafka-cluster-kafka-bootstrap.netobserv"
  - name: KafkaTLSEnable
    value: "false"
  - name: KafkaClusterName
    value: "kafka-cluster"
  - name: KafkaTopic
    value: "network-flows"
  - name: KafkaUser
    value: "flp-kafka"
  - name: KafkaNamespace
    value: "netobserv"
  - name: PluginEnable
    value: "true"
  - name: NetworkPolicyEnable
    value: "true"
  - name: NetworkPolicyAdditionalNamespaces
    value: '[]'
  - name: Exporters
    value: '[]'
  - name: SecondaryNetworks
    value: '[]'
  - name: "KafkaCompression"
    value: 'none'
  - name: ServiceTLSType
    description: "TLS type for Service deployment model (Auto, Provided, Disabled, Auto-mTLS)"
    value: "Auto"
  - name: ServiceCASecretName
    description: "CA certificate secret name for Service mode with Provided certificates"
    value: "prov-netobserv-ca-secret"
  - name: ServiceServerCertSecretName
    description: "Server certificate secret name for Service mode with Provided certificates"
    value: "prov-flowlogs-pipeline-cert"
  - name: ServiceClientCertSecretName
    description: "Client certificate secret name for Service mode with Provided certificates"
    value: "prov-ebpf-agent-cert"
