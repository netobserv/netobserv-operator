name: release to quay.io
on:
  push:
    tags: ['*']

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  WF_REGISTRY_USER: netobserv+operator_github_ci
  WF_REGISTRY: quay.io/netobserv
  WF_IMAGE: network-observability-operator
  WF_ORG: netobserv
  WF_MULTIARCH_TARGETS: amd64 arm64 ppc64le s390x

jobs:
  push-image:
    name: build and push release
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: validate tag
        run: |
          tag=`git describe --exact-match --tags 2> /dev/null`
          if [[ $tag =~ ^[0-9]+\.[0-9]+\.[0-9]+(-crc[0-9]+|-community)$ ]]; then
              echo "$tag is a valid release tag"
              set -e
              echo "tag=$tag" >> $GITHUB_ENV
          else
              echo "$tag is NOT a valid release tag"
              exit 1
          fi

      - name: install make
        run: sudo apt-get install make

      - name: build operator
        run: |
          MULTIARCH_TARGETS="${WF_MULTIARCH_TARGETS}" IMAGE_ORG=${WF_ORG} IMAGE=${WF_REGISTRY}/${WF_IMAGE}:${tag} VERSION=${tag} CLEAN_BUILD=1 make image-build

      - name: docker login to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.WF_REGISTRY_USER }}
          password: ${{ secrets.QUAY_SECRET }}
          registry: quay.io

      - name: push operator
        run: |
          MULTIARCH_TARGETS="${WF_MULTIARCH_TARGETS}" IMAGE_ORG=${WF_ORG} IMAGE=${WF_REGISTRY}/${WF_IMAGE}:${tag} make image-push

      - name: build and push manifest
        run: |
          MULTIARCH_TARGETS="${WF_MULTIARCH_TARGETS}" IMAGE_ORG=${WF_ORG} IMAGE=${WF_REGISTRY}/${WF_IMAGE}:${tag} make manifest-build manifest-push

      - name: build bundle
        run: |
          IMAGE_ORG=${WF_ORG} \
            VERSION=${tag} \
            BUNDLE_VERSION=${tag} \
            CLEAN_BUILD=1 \
            PIN_DIGEST=true \
            make bundle-nogen bundle-build

      - name: push bundle to quay.io
        run: IMAGE_ORG=${WF_ORG} BUNDLE_VERSION=${tag} make bundle-push

      - name: build catalog
        run: IMAGE_ORG=${WF_ORG} BUNDLE_VERSION=${tag} make catalog-build

      - name: push catalog to quay.io
        run: IMAGE_ORG=${WF_ORG} BUNDLE_VERSION=${tag} make catalog-push

      - name: extract binaries
        run: MULTIARCH_TARGETS="${WF_MULTIARCH_TARGETS}" IMAGE_ORG=${WF_ORG} VERSION=${tag} make extract-binaries

      - name: capture image digest
        id: image_digest
        run: |
          digest=$(docker buildx imagetools inspect ${WF_REGISTRY}/${WF_IMAGE}:${tag} \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_ENV"
          echo "${WF_REGISTRY}/${WF_IMAGE}@$digest" >> ./release-assets/images

      - name: cosign-installer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign and verify the image with GitHub OIDC Token
        run: |
          cosign sign --yes ${WF_REGISTRY}/${WF_IMAGE}@${digest}

          cosign verify ${WF_REGISTRY}/${WF_IMAGE}@${digest} \
            --certificate-identity=https://github.com/netobserv/netobserv-operator/.github/workflows/release.yml@refs/tags/${tag} \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com

      - name: Attest Provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.WF_REGISTRY }}/${{ env.WF_IMAGE }}
          subject-digest: ${{ env.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.WF_REGISTRY }}/${{ env.WF_IMAGE }}@${{ env.digest }}
          format: 'spdx-json'
          output-file: './release-assets/sbom.spdx.json'

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.WF_REGISTRY }}/${{ env.WF_IMAGE }}
          subject-digest: ${{ env.digest }}
          sbom-path: './release-assets/sbom.spdx.json'
          push-to-registry: true

      - name: create draft release and upload binaries
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.tag }}
          name: ${{ env.tag }}
          draft: true
          prerelease: false
          files: ./release-assets/*
