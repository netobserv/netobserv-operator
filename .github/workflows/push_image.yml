name: Build and push to quay.io
on:
  push:
    branches: [ main, release-*, workflow-test ]

env:
  WF_REGISTRY_USER: netobserv+operator_github_ci
  WF_REGISTRY: quay.io/netobserv
  WF_IMAGE: network-observability-operator
  WF_ORG: netobserv
  WF_MULTIARCH_TARGETS: amd64 arm64 ppc64le s390x
  WF_VERSION: ${{ github.ref_name }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-image:
    name: build and push images
    runs-on: ubuntu-latest
    steps:
      - name: install make
        run: sudo apt-get install make
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker login to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.WF_REGISTRY_USER }}
          password: ${{ secrets.QUAY_SECRET }}
          registry: quay.io
      - name: get short sha
        run: echo "short_sha=$(git rev-parse --short=8 HEAD)" >> $GITHUB_ENV
      - name: build images
        run: |
          # Optimization: preset LDFLAGS rather than letting it be recomputed each time in Makefile, for better cache reuse.
          LDFLAGS="-X 'main.buildVersion=$WF_VERSION-$short_sha' -X 'main.buildDate=$(date +%Y-%m-%d\ %H:%M)'"
          MULTIARCH_TARGETS="$WF_MULTIARCH_TARGETS" IMAGE_ORG="$WF_ORG" IMAGE="$WF_REGISTRY/$WF_IMAGE:$WF_VERSION" LDFLAGS="$LDFLAGS" make image-build
          MULTIARCH_TARGETS="$WF_MULTIARCH_TARGETS" IMAGE_ORG="$WF_ORG" IMAGE="$WF_REGISTRY/$WF_IMAGE:$short_sha" LDFLAGS="$LDFLAGS" OCI_BUILD_OPTS="--label quay.expires-after=2w" make image-build
      - name: push images
        run: |
          MULTIARCH_TARGETS="$WF_MULTIARCH_TARGETS" IMAGE_ORG="$WF_ORG" IMAGE="$WF_REGISTRY/$WF_IMAGE:$WF_VERSION" make image-push
          MULTIARCH_TARGETS="$WF_MULTIARCH_TARGETS" IMAGE_ORG="$WF_ORG" IMAGE="$WF_REGISTRY/$WF_IMAGE:$short_sha" make image-push
      - name: build and push manifest
        run: |
          MULTIARCH_TARGETS="$WF_MULTIARCH_TARGETS" IMAGE_ORG="$WF_ORG" IMAGE="$WF_REGISTRY/$WF_IMAGE:$WF_VERSION" make manifest-build manifest-push
          MULTIARCH_TARGETS="$WF_MULTIARCH_TARGETS" IMAGE_ORG="$WF_ORG" IMAGE="$WF_REGISTRY/$WF_IMAGE:$short_sha" make manifest-build manifest-push
      - name: build bundle
        run: |
          IMAGE_ORG="$WF_ORG" \
            VERSION="$WF_VERSION" \
            PLG_VERSION="$WF_VERSION" \
            FLP_VERSION="$WF_VERSION" \
            BPF_VERSION="$WF_VERSION" \
            BUNDLE_VERSION="0.0.0-sha-$WF_VERSION" \
            BUNDLE_TARGET=OpenShift \
            CLEAN_BUILD=1 \
            BUNDLE_SET_DATE=true \
            PIN_DIGEST=false \
            make bundle-nogen bundle-build
      - name: push bundle to quay.io
        run: IMAGE_ORG="$WF_ORG" BUNDLE_VERSION="0.0.0-sha-$WF_VERSION" make bundle-push
      - name: build catalog
        run: IMAGE_ORG="$WF_ORG" BUNDLE_VERSION="0.0.0-sha-$WF_VERSION" make catalog-build
      - name: push catalog to quay.io
        run: IMAGE_ORG="$WF_ORG" BUNDLE_VERSION="0.0.0-sha-$WF_VERSION" make catalog-push

  codecov:
    name: Codecov upload
    runs-on: ubuntu-latest
    steps:
    - name: install make
      run: sudo apt-get install make
    - name: set up go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'
        cache: false
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Test
      run: make test
    - name: Report coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        files: ./cover.out
        flags: unittests
        fail_ci_if_error: true
        verbose: true
