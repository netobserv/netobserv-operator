name: pull request checks

on:
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
    - name: install make
      run: sudo apt-get install make
    - name: set up go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: check format
      run: make fmt && git add -A && git diff --exit-code
    - name: build, lint, test
      run: make build lint test
    - name: check clean vendors
      run: go mod vendor
    - name: Report coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./cover.out
        flags: unittests
        fail_ci_if_error: false
        verbose: true

  bundle-check:
    runs-on: ubuntu-latest
    name: Checking bundle up-to-date
    steps:
    - name: install make
      run: sudo apt-get install make
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: generate bundle
      run: make update-bundle
    - name: check bundle clean state
      run: git add -A && git diff HEAD -I "operator-sdk-v" -I "createdAt" --exit-code
    - if: ${{ failure() }}
      name: print info
      run: echo "::error::Bundle isn't in a clean state. Did you forget to run 'make update-bundle' ?"; exit 1

  helm-check:
    runs-on: ubuntu-latest
    name: Checking helm up-to-date and valid
    steps:
    - name: install make
      run: sudo apt-get install make

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: generate helm
      run: make helm-update

    - name: check helm clean state
      run: git add -A && git diff HEAD --exit-code

    - name: set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.17.0

    - name: run helm lint
      run: helm lint helm/

  check-doc-parity:
    runs-on: ubuntu-latest
    name: Checking for CRD doc changes parity
    steps:
    - name: install make
      run: sudo apt-get install make

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 2

    - name: check doc parity
      run: hack/check-doc-parity.sh
