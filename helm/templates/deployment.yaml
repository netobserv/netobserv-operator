# static file: this is NOT auto-generated. Keep aligned with config/manager/manager.yaml (TODO: manage through kustomize).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netobserv-controller-manager
  labels:
    part-of: netobserv-operator
    app: netobserv-operator
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netobserv-operator
      control-plane: controller-manager
  strategy: {}
  template:
    metadata:
      labels:
        part-of: netobserv-operator
        app: netobserv-operator
        control-plane: controller-manager
    spec:
      containers:
      - command:
        - /manager
        args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8443
        - --leader-elect
        - --metrics-cert-file=/etc/tls/private/tls.crt
        - --metrics-cert-key-file=/etc/tls/private/tls.key
        env:
          - name: RELATED_IMAGE_EBPF_AGENT
{{- if .Values.ebpfAgent.digest }}
            value: '{{ .Values.ebpfAgent.image }}@{{ .Values.ebpfAgent.digest }}'
{{- else }}
            value: '{{ .Values.ebpfAgent.image }}:{{ .Values.ebpfAgent.version }}'
{{- end }}
          - name: RELATED_IMAGE_FLOWLOGS_PIPELINE
{{- if .Values.flowlogsPipeline.digest }}
            value: '{{ .Values.flowlogsPipeline.image }}@{{ .Values.flowlogsPipeline.digest }}'
{{- else }}
            value: '{{ .Values.flowlogsPipeline.image }}:{{ .Values.flowlogsPipeline.version }}'
{{- end }}
          - name: RELATED_IMAGE_WEB_CONSOLE
{{- if .Values.standaloneConsole.enable }}
  {{- if .Values.standaloneConsole.digest }}
            value: '{{ .Values.standaloneConsole.image }}@{{ .Values.standaloneConsole.digest }}'
  {{- else }}
            value: '{{ .Values.standaloneConsole.image }}:{{ .Values.standaloneConsole.version }}'
  {{- end }}
{{- else }}
  {{- if .Values.consolePlugin.digest }}
            value: '{{ .Values.consolePlugin.image }}@{{ .Values.consolePlugin.digest }}'
  {{- else }}
            value: '{{ .Values.consolePlugin.image }}:{{ .Values.consolePlugin.version }}'
  {{- end }}
{{- end }}
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OPERATOR_NETWORK_POLICY
            value: '{{ .Values.operator.installNetworkPolicy }}'
{{- if .Values.operator.digest }}
        image: '{{ .Values.operator.image }}@{{ .Values.operator.digest }}'
{{- else }}
        image: '{{ .Values.operator.image }}:{{ .Values.operator.version }}'
{{- end }}
        name: manager
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        ports:
          - containerPort: 9443
            name: webhook-server
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            memory: 400Mi
          requests:
            cpu: 100m
            memory: 100Mi
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
          - mountPath: /tmp/k8s-webhook-server/serving-certs
            name: cert
            readOnly: true
          - mountPath: /etc/tls/private
            name: manager-metric-tls
            readOnly: true
      securityContext:
        runAsNonRoot: true
      serviceAccountName: netobserv-controller-manager
      terminationGracePeriodSeconds: 10
{{- if .Values.operator.nodeAffinity }}
      affinity:
        nodeAffinity:
{{- toYaml .Values.operator.nodeAffinity | nindent 10 }}
{{- end }}
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: webhook-server-cert
        - name: manager-metric-tls
          secret:
            defaultMode: 420
            secretName: manager-metrics-tls
